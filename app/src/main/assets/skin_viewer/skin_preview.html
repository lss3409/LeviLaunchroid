<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<style>
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;
    background:linear-gradient(180deg,#3a3f4b 0%,#23262e 100%);}
  #c{display:block;}
  #hint{position:fixed;left:0;right:0;bottom:12px;text-align:center;
    color:rgba(255,255,255,.5);font:12px sans-serif;pointer-events:none;}
  /* v0.4.199：底部 64dp 相册条覆盖展示区——轴动态上移到条上方
     （create/layoutAxes 按窗口高度算，CSS 兜底） */
  #axes{position:fixed;left:10px;bottom:12px;pointer-events:none;}
</style>
</head>
<body>
<canvas id="c"></canvas>
<canvas id="axes" width="72" height="72"></canvas>
<div id="hint">拖动旋转 · 滚轮缩放</div>
<script src="skinview3d.bundle.js"></script>
<script>
var viewer = null;
var pending = null;

function realSize() {
  var w = window.innerWidth || document.documentElement.clientWidth;
  var h = window.innerHeight || document.documentElement.clientHeight;
  if (!w || !h) { return {w: 360, h: 520}; }
  return {w: w, h: h};
}

function create() {
  if (viewer) { destroy(); }
  var s = realSize();
  var c = document.getElementById('c');
  c.width = s.w;
  c.height = s.h;
  try {
    viewer = new skinview3d.SkinViewer({
      canvas: c,
      width: s.w,
      height: s.h
    });
    try { viewer.autoRotate = true; } catch (e) {}
    try { viewer.fov = 55; } catch (e) {}
    try { viewer.zoom = 0.75; } catch (e) {}
    // 相机轻微俯视（比例修正：正侧面平视会显矮）
    try {
      var cam = viewer.camera;
      cam.position.set(20, 12, 42);
      cam.lookAt(0, 0, 0);
    } catch (e) {}
  } catch (e) {
    viewer = null;
  }
  bindDrag();
  if (pending && viewer) {
    var p = pending; pending = null;
    doLoad(p);
  }
}

function destroy() {
  try { if (viewer && viewer.dispose) viewer.dispose(); } catch (e) {}
  viewer = null;
}

// v0.4.197：用户拖动时关闭自动旋转
function bindDrag() {
  var c = document.getElementById('c');
  c.addEventListener('pointerdown', function() {
    if (viewer) { try { viewer.autoRotate = false; } catch (e) {} }
  });
}

function doLoad(dataUrl) {
  if (!viewer) { pending = dataUrl; return; }
  try { viewer.loadSkin(dataUrl); } catch (e) {}
}

function loadSkin(dataUrl) { doLoad(dataUrl); }

// v0.4.197：左下角 XYZ 坐标轴（地图查看器 3D 视图同款等距轴）
// v0.4.198/199：轴随模型旋转更新——100ms 循环读相机方位角与模型自转。
// skinview3d 的 autoRotate 是模型自转（playerWrapper.rotation.y +=），
// 拖动是 OrbitControls 相机转（yaw）——模型视觉旋转 V = r - yaw，
// 轴作为「模型身上的轴」跟随 V 转。等距投影：绕 Y 转 V 后
// 世界 X → sx=(cosV+sinV)k, sy=(cosV-sinV)j；Z → (sinV-cosV, sinV+cosV)。
function drawAxes() {
  var a = document.getElementById('axes');
  var g = a.getContext('2d');
  // v0.4.199：循环重绘必须先重置 transform——translate 会累积
  // （每帧 +28px 轴漂移出画布），clearRect 也受当前 transform 影响
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.clearRect(0, 0, 72, 72);
  g.translate(28, 46);
  var yaw = 0, r = 0;
  try {
    if (viewer && viewer.camera && viewer.camera.position) {
      var p = viewer.camera.position;
      yaw = Math.atan2(p.x, p.z);
    }
    if (viewer && viewer.playerWrapper && viewer.playerWrapper.rotation) {
      r = viewer.playerWrapper.rotation.y || 0;
    }
  } catch (e) {}
  var th = r - yaw;
  var cosT = Math.cos(th), sinT = Math.sin(th);
  var k = Math.cos(Math.PI / 6), j = Math.sin(Math.PI / 6);
  var len = 20;
  // 世界 +X 绕 Y 转 th → 等距投影 sx=(dx-dz)k, sy=(dx+dz)j
  var xx = (cosT + sinT) * k * len, xy = (cosT - sinT) * j * len;
  var zx = (sinT - cosT) * k * len, zy = (sinT + cosT) * j * len;
  g.lineWidth = 2;
  g.strokeStyle = '#E0564B'; g.beginPath(); g.moveTo(0, 0); g.lineTo(xx, xy); g.stroke();
  g.strokeStyle = '#4CAF50'; g.beginPath(); g.moveTo(0, 0); g.lineTo(0, -20); g.stroke();
  g.strokeStyle = '#5C8DD8'; g.beginPath(); g.moveTo(0, 0); g.lineTo(zx, zy); g.stroke();
  g.font = 'bold 10px sans-serif';
  g.fillStyle = '#E0564B'; g.fillText('X', xx * 1.3, xy * 1.3 + 3);
  g.fillStyle = '#4CAF50'; g.fillText('Y', 4, -24);
  g.fillStyle = '#5C8DD8'; g.fillText('Z', zx * 1.3, zy * 1.3 + 3);
}

var axesLoop = null;
function startAxesLoop() {
  if (axesLoop) { return; }
  axesLoop = setInterval(drawAxes, 100);
}

// v0.4.199：轴位置动态上移到相册条（WebView 高度 64/340）上方，
// 底部相册条会遮住 fixed bottom:12 的轴
function layoutAxes() {
  var a = document.getElementById('axes');
  var h = window.innerHeight || document.documentElement.clientHeight || 850;
  a.style.bottom = (h * 64 / 340 + 12) + 'px';
}

var initTries = 0;
function tryInit() {
  if (window.innerWidth > 0 || document.documentElement.clientWidth > 0) {
    create();
    drawAxes();
    layoutAxes();
    startAxesLoop();
  } else if (initTries++ < 30) {
    setTimeout(tryInit, 100);
  }
}
window.addEventListener('load', tryInit);
window.addEventListener('resize', function() {
  if (viewer) { create(); }
  layoutAxes();
  drawAxes();
});
</script>
</body>
</html>
